name: reperes
# Postgres local. Airflow s'ajoutera ici au Sprint 1.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reperes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reperes}
      POSTGRES_DB: ${POSTGRES_DB:-reperes}
    ports:
      - '${POSTGRES_PORT:-5450}:5432'
    volumes:
      - reperes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  reperes_pgdata:
