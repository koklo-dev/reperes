name: CI
on:
  pull_request:
  push:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: reperes, POSTGRES_PASSWORD: reperes, POSTGRES_DB: reperes }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U reperes" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://reperes:reperes@localhost:5432/reperes?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: touch .env && pnpm db:migrate && pnpm db:seed
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
